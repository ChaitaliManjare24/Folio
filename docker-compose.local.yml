# Local Docker Compose for SimpleAIFolio
# Modified from production config for local development/testing
# Usage: docker compose -f docker-compose.local.yml up -d --build
#
# Key differences from prod:
# - Ports exposed to localhost for direct browser access
# - No external proxy network required
# - Simplified networking (all on one network)

name: simpleaifolio-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simpleaifolio
      POSTGRES_USER: simpleaifolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - simpleaifolio_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpleaifolio"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://simpleaifolio:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/simpleaifolio
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3200}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
      AI_ALERT_WEBHOOK_URL: ${AI_ALERT_WEBHOOK_URL:-}
      AI_ALERT_MIN_LEVEL: ${AI_ALERT_MIN_LEVEL:-warning}
      AI_ALERT_COOLDOWN_MS: ${AI_ALERT_COOLDOWN_MS:-300000}
      AI_ALERT_FAILURE_THRESHOLD: ${AI_ALERT_FAILURE_THRESHOLD:-3}
      AI_ALERT_HIGH_LATENCY_MS: ${AI_ALERT_HIGH_LATENCY_MS:-15000}
      AI_ALERT_LATENCY_THRESHOLD: ${AI_ALERT_LATENCY_THRESHOLD:-3}
      AI_ALERT_LOOKBACK_MS: ${AI_ALERT_LOOKBACK_MS:-900000}
      AI_ALERT_COST_LOOKBACK_MS: ${AI_ALERT_COST_LOOKBACK_MS:-3600000}
      AI_ALERT_COST_SPIKE_MULTIPLIER: ${AI_ALERT_COST_SPIKE_MULTIPLIER:-1.5}
      AI_ALERT_COST_SPIKE_MIN_USD: ${AI_ALERT_COST_SPIKE_MIN_USD:-1}
      AI_ALERT_COST_SPIKE_MIN_DELTA_USD: ${AI_ALERT_COST_SPIKE_MIN_DELTA_USD:-0.5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RUN_SEED_ON_STARTUP: "true"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      # AI Provider settings
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-6000}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-60000}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-20}
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-disabled}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:-}
    volumes:
      - simpleaifolio_uploads_local:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app
    # Expose backend to localhost for API access
    ports:
      - "3201:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3200}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3200}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3200}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3200}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app
    # Expose frontend to localhost for browser access
    ports:
      - "3200:3000"

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MCP_API_URL: http://backend:3001
      MCP_AUTH_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      MCP_AUTH_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      MCP_HTTP: "true"
      MCP_HTTP_PORT: "3100"
      MCP_MCP_CONFIG_URL: http://backend:3001/api/mcp-config
      MCP_API_TIMEOUT_MS: "120000"
    networks:
      app:
        aliases:
          - simpleaifolio-mcp
    # Expose MCP server to localhost for testing
    ports:
      - "3100:3100"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
    # Expose gateway to localhost (alternative to direct frontend access)
    ports:
      - "8080:80"

networks:
  app:
    name: simpleaifolio_local_app

volumes:
  simpleaifolio_pgdata_local:
    name: simpleaifolio_pgdata_local
  simpleaifolio_uploads_local:
    name: simpleaifolio_uploads_local
