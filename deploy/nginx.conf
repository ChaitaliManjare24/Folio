# SimpleAIFolio Gateway — sits behind Nginx Proxy Manager or external reverse proxy
#
# This gateway listens on port 80 (HTTP only). The external reverse proxy
# handles TLS termination and forwards decrypted traffic here.
#
# Dynamic Docker DNS resolution ensures containers are reachable after recreation.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Health check endpoint for Docker
    location /healthz {
        return 200;
    }

    # MCP protocol endpoint -> MCP server
    # The MCP transport can stream responses, so buffering is disabled.
    location /mcp {
        set $mcp http://simpleaifolio-mcp:3100;
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API requests → backend
    location /api/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media → backend
    location /uploads/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # ===== Homepage + portfolio now served by the Next.js app (CMS-driven) =====
    # The static landing/index.html and portfolio.html are kept in /var/www/landing
    # for rollback reference, but no longer served at / — the app renders them from
    # editable backend settings instead. Landing CSS/JS are served by the app's
    # /landing-assets/ public folder.

    # ===== Portfolio template files (self-contained template directories) =====
    # The /portfolio gallery page itself is served by the Next.js app; only the
    # individual template previews (/portfolio/<template>/) come from static files.
    location /portfolio/ {
        alias /var/www/templates/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Everything else (homepage, /portfolio, /blog, /contact, /about, /feed.xml,
    # /admin/*, /landing-assets/*, static assets) → frontend
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
