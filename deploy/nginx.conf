# SimpleAIFolio Gateway — sits behind Nginx Proxy Manager or external reverse proxy
#
# This gateway listens on port 80 (HTTP only). The external reverse proxy
# handles TLS termination and forwards decrypted traffic here.
#
# Dynamic Docker DNS resolution ensures containers are reachable after recreation.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Health check endpoint for Docker
    location /healthz {
        return 200;
    }

    # MCP protocol endpoint -> MCP server
    # The MCP transport can stream responses, so buffering is disabled.
    location /mcp {
        set $mcp http://simpleaifolio-mcp:3100;
        proxy_pass $mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API requests → backend
    location /api/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media → backend
    location /uploads/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # ===== Static landing page at root only =====
    # bit2byte.app/ serves the marketing landing page (static HTML/CSS/JS).
    # Every other path (/blog, /contact, /about, /projects, /feed.xml, /admin/*, ...)
    # still routes to the simpleaifolio Next.js frontend below. Exact-match `=`
    # wins over the prefix `location /`, so ONLY the bare homepage is intercepted.
    location = / {
        root /var/www/landing;
        try_files /index.html =404;
    }

    # Landing page static assets (prefixed paths in index.html avoid collision
    # with Next.js's own static files).
    location /landing-assets/ {
        alias /var/www/landing/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # ===== Portfolio showcase + template files =====
    # Gallery page listing all landing page templates
    location = /portfolio {
        root /var/www/landing;
        try_files /portfolio.html =404;
    }
    # Redirect trailing slash to avoid serving the old bit2byte.tech index
    location = /portfolio/ {
        return 301 /portfolio;
    }
    # Individual template files (each template is a self-contained directory)
    location /portfolio/ {
        alias /var/www/templates/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Everything else (including /feed.xml, pages, static assets) → frontend
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
